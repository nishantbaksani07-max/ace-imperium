<!-- CANONICAL small-face design for the Studio tile (provided by Alex, 2026-07-03).
     This is the exact look the real v1 tile's small/dashboard face must match:
     professional, minimalist, groundbreaking. Mint #9be7b8, Instrument Serif hero number,
     mono kickers, spark bars, ghost-mint open button. No emoji, no em dashes. -->
<div class="st-card">
  <div class="st-top">
    <span class="st-brand"><span class="st-dot"></span>STUDIO</span>
    <span class="st-conn">example<b>CONNECTED</b></span>
  </div>

  <div class="st-body">
    <div class="st-hero"><b>6</b><span>in flight</span></div>
    <div class="st-next">
      <span class="st-k">NEXT UP</span>
      <span class="st-v">Deload week &middot; Fri 6pm</span>
    </div>
  </div>

  <div class="st-foot">
    <div class="st-stat">
      <span class="st-spark"><i style="height:32%"></i><i style="height:54%"></i><i style="height:44%"></i><i style="height:78%"></i><i style="height:100%"></i></span>
      <span class="st-views"><b>11.3k</b> views this week</span>
    </div>
    <button class="st-open" aria-label="Open Studio">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg>
    </button>
  </div>

  <style>
    .st-card{
      --mint:#9be7b8; --mint-dim:#6fb98d; --text:#eef2ef; --muted:#8a938c; --muted-2:#5f665f;
      --serif:'Instrument Serif','Iowan Old Style',Georgia,serif;
      --mono:ui-monospace,'SF Mono',Menlo,monospace;
      --sans:'Inter',-apple-system,system-ui,sans-serif;
      width:340px; box-sizing:border-box; padding:22px 24px 20px;
      background:linear-gradient(180deg,#0c0f0d,#090b0a);
      border:1px solid rgba(255,255,255,.09); border-radius:22px;
      font-family:var(--sans); color:var(--text);
      box-shadow:0 20px 60px rgba(0,0,0,.4);
    }
    .st-card *{box-sizing:border-box}
    .st-top{display:flex; align-items:center; justify-content:space-between}
    .st-brand{display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:11px; letter-spacing:.16em; color:var(--mint-dim)}
    .st-dot{width:7px; height:7px; border-radius:50%; background:var(--mint); box-shadow:0 0 0 4px rgba(155,231,184,.14)}
    .st-conn{font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--muted); text-align:right; line-height:1.5}
    .st-conn b{display:block; font-weight:400; font-size:9.5px; letter-spacing:.14em; color:var(--muted-2)}

    .st-body{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin:22px 0 20px}
    .st-hero{display:flex; align-items:baseline; gap:9px}
    .st-hero b{font-family:var(--serif); font-weight:400; font-size:52px; line-height:.9}
    .st-hero span{font-size:13px; color:var(--muted)}
    .st-next{text-align:right}
    .st-k{display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; color:var(--muted-2); margin-bottom:3px}
    .st-v{font-size:13px; color:var(--text)}
    .st-v::first-line{color:var(--mint)}

    .st-foot{display:flex; align-items:center; justify-content:space-between; padding-top:16px; border-top:1px solid rgba(255,255,255,.07)}
    .st-stat{display:flex; align-items:center; gap:11px}
    .st-spark{display:flex; align-items:flex-end; gap:3px; width:34px; height:20px}
    .st-spark i{flex:1; background:linear-gradient(180deg,var(--mint),#3f7d5b); border-radius:2px}
    .st-views{font-size:12.5px; color:var(--muted)}
    .st-views b{color:var(--text); font-weight:500}
    .st-open{width:38px; height:38px; border-radius:11px; border:1px solid rgba(255,255,255,.14); background:transparent; color:var(--muted); cursor:pointer; display:grid; place-items:center; transition:color .15s, border-color .15s}
    .st-open:hover{color:var(--mint); border-color:var(--mint-dim)}
  </style>
</div>
