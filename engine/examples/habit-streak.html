<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}
html,body{height:100%}
body{background:transparent;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;accent-color:#6EE7B7;margin:0}
.wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;min-height:100svh;padding:clamp(12px,3.2vw,40px);gap:clamp(7px,2vw,22px);text-align:center;overflow:auto}
.habit-row{display:flex;align-items:center;gap:6px;max-width:100%}
.habit{background:transparent;border:none;color:#fff;font:inherit;font-size:clamp(14px,3.2vw,22px);font-weight:600;text-align:center;letter-spacing:.2px;padding:5px 8px;border-radius:10px;min-width:40px;max-width:min(82vw,360px);width:auto;outline:none;transition:background .3s cubic-bezier(.16,1,.3,1)}
.habit:hover{background:rgba(255,255,255,.05)}
.habit:focus{background:rgba(110,231,183,.10)}
.edit-ic{flex:0 0 auto;opacity:.45;transition:opacity .3s cubic-bezier(.16,1,.3,1)}
.habit-row:hover .edit-ic{opacity:.8}
.streak-block{display:flex;flex-direction:column;align-items:center;gap:0}
.num{font-size:clamp(40px,14vw,140px);font-weight:800;line-height:.92;letter-spacing:-2px;color:#6EE7B7;text-shadow:0 0 30px rgba(110,231,183,.28);transition:transform .5s cubic-bezier(.16,1,.3,1)}
.num.pop{transform:scale(1.12)}
.unit{font-size:clamp(12px,2.8vw,18px);font-weight:600;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.55)}
.btn{appearance:none;border:none;cursor:pointer;font:inherit;font-weight:700;font-size:clamp(14px,3.4vw,19px);color:#04140d;background:#6EE7B7;border-radius:999px;padding:clamp(11px,2.6vw,18px) clamp(22px,6vw,44px);min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 8px 28px rgba(110,231,183,.30);transition:transform .4s cubic-bezier(.16,1,.3,1),box-shadow .4s cubic-bezier(.16,1,.3,1),opacity .4s cubic-bezier(.16,1,.3,1)}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(110,231,183,.40)}
.btn:active{transform:translateY(0) scale(.97)}
.done-state{display:flex;flex-direction:column;align-items:center;gap:10px}
.done-msg{display:inline-flex;align-items:center;gap:9px;font-size:clamp(13px,3.2vw,18px);font-weight:600;color:rgba(255,255,255,.82);padding:clamp(10px,2.4vw,16px) clamp(18px,4.6vw,30px);min-height:48px;border-radius:999px;background:rgba(110,231,183,.10);border:1px solid rgba(110,231,183,.22)}
.check{flex:0 0 auto}
.best{display:inline-flex;align-items:center;gap:7px;font-size:clamp(11px,2.6vw,13px);font-weight:600;letter-spacing:.4px;color:rgba(255,255,255,.50)}
.best svg{flex:0 0 auto;opacity:.7}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.wrap>*{animation:fadeUp .5s cubic-bezier(.16,1,.3,1) both}
.wrap>*:nth-child(2){animation-delay:.05s}
.wrap>*:nth-child(3){animation-delay:.1s}
.wrap>*:nth-child(4){animation-delay:.15s}
</style></head><body>
<div class="wrap">
  <div class="habit-row">
    <input id="habit" class="habit" maxlength="40" aria-label="Habit name" spellcheck="false"/>
    <svg class="edit-ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6EE7B7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
  </div>
  <div class="streak-block">
    <div id="num" class="num">0</div>
    <div id="unit" class="unit">days</div>
  </div>
  <div id="action"></div>
  <div id="bestRow" class="best" hidden>
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6EE7B7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16 3 5l5.5 4L12 4l3.5 5L21 5l-2 11Z"/><path d="M5 16h14"/></svg>
    <span id="bestTxt"></span>
  </div>
</div>
<script>
var Vitality={_w:{},save:function(d){parent.postMessage({source:'vitality-tile',type:'save',data:d},'*')},load:function(){return new Promise(function(res){var id=Math.random().toString(36).slice(2);Vitality._w[id]=res;parent.postMessage({source:'vitality-tile',type:'load',id:id},'*')})}};
window.addEventListener('message',function(e){var m=e.data;if(m&&m.source==='vitality-host'&&m.type==='load:result'&&Vitality._w[m.id]){Vitality._w[m.id](m.data);delete Vitality._w[m.id]}});

function dateKey(d){d=d||new Date();var y=d.getFullYear(),m=('0'+(d.getMonth()+1)).slice(-2),day=('0'+d.getDate()).slice(-2);return y+'-'+m+'-'+day}
function yesterdayKey(){var d=new Date();d.setDate(d.getDate()-1);return dateKey(d)}

var DEFAULTS={name:'Move my body',streak:0,lastDone:null,best:0};
var state=Object.assign({},DEFAULTS);

function sanitize(d){
  var s=Object.assign({},DEFAULTS);
  if(d&&typeof d==='object'){
    if(typeof d.name==='string'&&d.name.trim())s.name=d.name.slice(0,40);
    if(typeof d.streak==='number'&&isFinite(d.streak)&&d.streak>=0)s.streak=Math.floor(d.streak);
    if(typeof d.lastDone==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d.lastDone))s.lastDone=d.lastDone;
    if(typeof d.best==='number'&&isFinite(d.best)&&d.best>=0)s.best=Math.floor(d.best);
  }
  if(s.best<s.streak)s.best=s.streak;
  return s;
}

var habitEl=document.getElementById('habit'),numEl=document.getElementById('num'),unitEl=document.getElementById('unit'),actionEl=document.getElementById('action'),bestRow=document.getElementById('bestRow'),bestTxt=document.getElementById('bestTxt');

function doneToday(){return state.lastDone===dateKey()}

function render(){
  if(document.activeElement!==habitEl)habitEl.value=state.name;
  numEl.textContent=state.streak;
  unitEl.textContent=state.streak===1?'day':'days';
  actionEl.innerHTML='';
  if(doneToday()){
    var ds=document.createElement('div');ds.className='done-state';
    var msg=document.createElement('div');msg.className='done-msg';
    msg.innerHTML='<svg class="check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6EE7B7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span>Done. See you tomorrow.</span>';
    ds.appendChild(msg);actionEl.appendChild(ds);
  }else{
    var b=document.createElement('button');b.className='btn';b.type='button';
    b.innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#04140d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span>Done today</span>';
    b.addEventListener('click',markDone);
    actionEl.appendChild(b);
  }
  if(state.best>0){bestRow.hidden=false;bestTxt.textContent='Best '+state.best+' '+(state.best===1?'day':'days');}
  else{bestRow.hidden=true;}
}

function markDone(){
  if(doneToday())return;
  if(state.lastDone===yesterdayKey()){state.streak=state.streak+1;}
  else{state.streak=1;}
  state.lastDone=dateKey();
  if(state.streak>state.best)state.best=state.streak;
  Vitality.save(state);
  render();
  numEl.classList.remove('pop');void numEl.offsetWidth;numEl.classList.add('pop');
}

habitEl.addEventListener('input',function(){
  state.name=habitEl.value.slice(0,40);
  Vitality.save(state);
});
habitEl.addEventListener('blur',function(){
  if(!state.name.trim()){state.name=DEFAULTS.name;habitEl.value=state.name;Vitality.save(state);}
});
habitEl.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();habitEl.blur();}});

Vitality.load().then(function(d){
  state=sanitize(d);
  Vitality.save(state);
  render();
}).catch(function(){state=Object.assign({},DEFAULTS);render();});
</script>
</body></html>
