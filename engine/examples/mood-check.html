<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}
body{background:transparent;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;accent-color:#6EE7B7;margin:0;-webkit-font-smoothing:antialiased}
.wrap{display:flex;flex-direction:column;gap:clamp(14px,4vw,26px);padding:clamp(14px,4vw,28px);max-width:560px;margin:0 auto}
.head{display:flex;flex-direction:column;gap:4px}
.title{font-size:clamp(15px,4.4vw,20px);font-weight:600;letter-spacing:-.01em}
.sub{font-size:clamp(12px,3.4vw,14px);color:rgba(255,255,255,.55);font-weight:400;line-height:1.4}
.faces{display:flex;gap:clamp(6px,2.2vw,12px);justify-content:space-between}
.face{flex:1;aspect-ratio:1;min-width:0;min-height:44px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);border-radius:18px;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);transition:transform .5s cubic-bezier(.16,1,.3,1),background .5s cubic-bezier(.16,1,.3,1),border-color .5s cubic-bezier(.16,1,.3,1),color .5s cubic-bezier(.16,1,.3,1)}
.face svg{width:64%;height:64%;display:block}
.face:hover{background:rgba(255,255,255,.06);transform:translateY(-2px)}
.face:active{transform:scale(.94)}
.face.on{transform:translateY(-2px) scale(1.04)}
.face:focus-visible{outline:2px solid #6EE7B7;outline-offset:2px}
.row{display:flex;flex-direction:column;gap:9px}
.rowlabel{font-size:clamp(10px,2.8vw,11px);text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.4);font-weight:600}
.dots{display:flex;gap:clamp(5px,2vw,10px);align-items:center}
.day{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.dot{width:clamp(14px,5vw,22px);height:clamp(14px,5vw,22px);border-radius:50%;background:rgba(255,255,255,.07);transition:background .5s cubic-bezier(.16,1,.3,1),box-shadow .5s cubic-bezier(.16,1,.3,1)}
.dot.today{box-shadow:0 0 0 2px rgba(110,231,183,.5)}
.dname{font-size:clamp(9px,2.6vw,11px);color:rgba(255,255,255,.35);font-weight:500}
.dname.t{color:#6EE7B7}
</style></head><body>
<div class="wrap">
  <div class="head">
    <div class="title">Today's mood</div>
    <div class="sub" id="sub">Tap a face to log how you feel.</div>
  </div>
  <div class="faces" id="faces"></div>
  <div class="row">
    <div class="rowlabel">Last 7 days</div>
    <div class="dots" id="dots"></div>
  </div>
</div>
<script>
var Vitality={_w:{},save:function(d){parent.postMessage({source:'vitality-tile',type:'save',data:d},'*')},load:function(){return new Promise(function(res){var id=Math.random().toString(36).slice(2);Vitality._w[id]=res;parent.postMessage({source:'vitality-tile',type:'load',id:id},'*')})}};
window.addEventListener('message',function(e){var m=e.data;if(m&&m.source==='vitality-host'&&m.type==='load:result'&&Vitality._w[m.id]){Vitality._w[m.id](m.data);delete Vitality._w[m.id]}});

// warm gradient amber (low) -> mint (great), never red
var COLORS={1:'#E8964A',2:'#E6B25C',3:'#CFD17A',4:'#A6E08C',5:'#6EE7B7'};
var LABELS={1:'Low.',2:'Meh.',3:'Okay.',4:'Good.',5:'Great.'};

// five distinct faces (mouth curve from frown to big smile)
function faceSVG(score,active){
  var stroke=active?'#0c0c0c':'currentColor';
  var mouths={
    1:'M9 16.2 Q12 13.6 15 16.2',
    2:'M9 15.2 Q12 14.2 15 15.2',
    3:'M9 15 L15 15',
    4:'M9 14.2 Q12 16.6 15 14.2',
    5:'M8.4 14 Q12 18.2 15.6 14'
  };
  var eyeY=score>=5?9.6:9.8;
  return '<svg viewBox="0 0 24 24" fill="none" stroke="'+stroke+'" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    +'<circle cx="9" cy="'+eyeY+'" r="0.5" fill="'+stroke+'" stroke="none"/>'
    +'<circle cx="15" cy="'+eyeY+'" r="0.5" fill="'+stroke+'" stroke="none"/>'
    +'<path d="'+mouths[score]+'"/></svg>';
}

var state={days:[],today:null};

function localKey(d){d=d||new Date();var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+da;}
function todayKey(){return localKey();}
function dayName(d){return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];}

function scoreFor(key){for(var i=0;i<state.days.length;i++){if(state.days[i]&&state.days[i].date===key)return state.days[i].score;}return null;}

function setToday(score){
  var key=todayKey();
  var found=false;
  for(var i=0;i<state.days.length;i++){if(state.days[i]&&state.days[i].date===key){state.days[i].score=score;found=true;break;}}
  if(!found)state.days.push({date:key,score:score});
  // keep tidy: last 60 entries
  state.days=state.days.filter(function(x){return x&&typeof x.date==='string'&&x.score>=1&&x.score<=5;});
  if(state.days.length>60)state.days=state.days.slice(state.days.length-60);
  state.today=score;
  Vitality.save(state);
  render();
}

function render(){
  var tk=todayKey();
  var cur=scoreFor(tk);
  var faces=document.getElementById('faces');
  faces.innerHTML='';
  for(var s=1;s<=5;s++){
    (function(s){
      var b=document.createElement('button');
      b.className='face'+(cur===s?' on':'');
      b.setAttribute('aria-label',LABELS[s]+' mood');
      b.setAttribute('aria-pressed',cur===s?'true':'false');
      if(cur===s){b.style.background=COLORS[s];b.style.borderColor=COLORS[s];}
      b.innerHTML=faceSVG(s,cur===s);
      b.onclick=function(){setToday(s);};
      faces.appendChild(b);
    })(s);
  }
  var sub=document.getElementById('sub');
  if(cur){sub.textContent=LABELS[cur]+' Logged for today.';}
  else{sub.textContent='Tap a face to log how you feel.';}

  var dots=document.getElementById('dots');
  dots.innerHTML='';
  for(var i=6;i>=0;i--){
    var d=new Date();d.setDate(d.getDate()-i);
    var key=localKey(d);
    var sc=scoreFor(key);
    var day=document.createElement('div');day.className='day';
    var dot=document.createElement('div');dot.className='dot'+(i===0?' today':'');
    if(sc)dot.style.background=COLORS[sc];
    var nm=document.createElement('div');nm.className='dname'+(i===0?' t':'');nm.textContent=i===0?'Today':dayName(d);
    day.appendChild(dot);day.appendChild(nm);dots.appendChild(day);
  }
}

function hydrate(d){
  state={days:[],today:null};
  if(d&&typeof d==='object'){
    if(Array.isArray(d.days)){
      for(var i=0;i<d.days.length;i++){
        var x=d.days[i];
        if(x&&typeof x.date==='string'&&typeof x.score==='number'&&x.score>=1&&x.score<=5){
          state.days.push({date:x.date,score:Math.round(x.score)});
        }
      }
    }
    var t=scoreFor(todayKey());
    if(t)state.today=t;
  }
}

Vitality.load().then(function(d){hydrate(d);render();}).catch(function(){hydrate(null);render();});
</script>
</body></html>
