<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}
body{background:transparent;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;accent-color:#6EE7B7;margin:0}
.wrap{display:flex;flex-direction:column;gap:clamp(12px,2.5vw,18px);padding:clamp(14px,3vw,22px);max-width:640px;margin:0 auto;min-height:100%}
.head{display:flex;align-items:center;gap:9px}
.head svg{flex:0 0 auto}
.title{font-size:clamp(13px,2.4vw,15px);font-weight:600;letter-spacing:.2px;color:rgba(255,255,255,.92)}
.sub{font-size:11px;color:rgba(255,255,255,.4);margin-top:1px;font-weight:500}
.compose{display:flex;flex-direction:column;gap:10px}
.field{position:relative;display:flex;align-items:center}
.input{width:100%;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);border-radius:14px;color:#fff;font:inherit;font-size:clamp(14px,2.6vw,15px);padding:14px 15px;outline:none;transition:border-color .3s cubic-bezier(.16,1,.3,1),background .3s cubic-bezier(.16,1,.3,1)}
.input::placeholder{color:rgba(255,255,255,.32)}
.input:focus{border-color:rgba(110,231,183,.5);background:rgba(110,231,183,.05)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.count{font-size:11px;color:rgba(255,255,255,.32);font-variant-numeric:tabular-nums;transition:color .3s cubic-bezier(.16,1,.3,1)}
.count.warn{color:#E8964A}
.save{display:inline-flex;align-items:center;gap:7px;background:rgba(110,231,183,.14);border:1px solid rgba(110,231,183,.3);color:#6EE7B7;font:inherit;font-weight:600;font-size:13px;padding:11px 18px;border-radius:12px;cursor:pointer;transition:transform .3s cubic-bezier(.16,1,.3,1),background .3s cubic-bezier(.16,1,.3,1),opacity .3s}
.save:hover:not(:disabled){background:rgba(110,231,183,.22)}
.save:active:not(:disabled){transform:scale(.96)}
.save:disabled{opacity:.4;cursor:default}
.save.saved{background:rgba(185,163,255,.16);border-color:rgba(185,163,255,.34);color:#b9a3ff}
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent)}
.list{display:flex;flex-direction:column;gap:2px;list-style:none;padding:0;margin:0}
.entry{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.04);animation:rise .5s cubic-bezier(.16,1,.3,1) both}
.entry:last-child{border-bottom:none}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.date{flex:0 0 auto;width:clamp(46px,11vw,58px);font-size:11px;font-weight:600;color:#b9a3ff;line-height:1.35;font-variant-numeric:tabular-nums;padding-top:1px}
.date.today{color:#6EE7B7}
.date small{display:block;font-size:9px;font-weight:600;letter-spacing:.5px;color:rgba(255,255,255,.3);text-transform:uppercase;margin-top:1px}
.text{flex:1;font-size:clamp(13px,2.5vw,14.5px);line-height:1.5;color:rgba(255,255,255,.86);word-break:break-word}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 16px;color:rgba(255,255,255,.46)}
.empty svg{opacity:.85}
.empty p{margin:0;font-size:13px;line-height:1.5;max-width:240px}
.empty .accent{color:#b9a3ff;font-weight:600}
.scroll{overflow-y:auto;max-height:none}
@media(min-height:520px){.scroll{flex:1}}
</style></head><body>
<div class="wrap">
  <div class="head">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6EE7B7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    <div>
      <div class="title">One Line a Day</div>
      <div class="sub" id="sub">A single line about today</div>
    </div>
  </div>

  <div class="compose">
    <div class="field">
      <input id="input" class="input" type="text" maxlength="160" placeholder="One line about today" autocomplete="off" />
    </div>
    <div class="row">
      <span class="count" id="count">0 / 160</span>
      <button class="save" id="save" disabled>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>
        <span id="saveLabel">Save line</span>
      </button>
    </div>
  </div>

  <div class="divider"></div>

  <div class="scroll" id="scroll"></div>
</div>

<script>
var Vitality={_w:{},save:function(d){parent.postMessage({source:'vitality-tile',type:'save',data:d},'*')},load:function(){return new Promise(function(res){var id=Math.random().toString(36).slice(2);Vitality._w[id]=res;parent.postMessage({source:'vitality-tile',type:'load',id:id},'*')})}};
window.addEventListener('message',function(e){var m=e.data;if(m&&m.source==='vitality-host'&&m.type==='load:result'&&Vitality._w[m.id]){Vitality._w[m.id](m.data);delete Vitality._w[m.id]}});

var MAX=160;
var entries=[];
var savedTimer=null;

var input=document.getElementById('input');
var save=document.getElementById('save');
var saveLabel=document.getElementById('saveLabel');
var count=document.getElementById('count');
var scroll=document.getElementById('scroll');
var sub=document.getElementById('sub');

function pad(n){return n<10?'0'+n:''+n}
function todayKey(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}

var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function parseKey(k){var p=String(k).split('-');return new Date(+p[0],(+p[1]||1)-1,+p[2]||1)}
function fmtDate(k){var d=parseKey(k);return{day:d.getDate(),mon:MON[d.getMonth()]}}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function sanitize(raw){
  var out=[];
  if(!raw||!Array.isArray(raw.entries)){
    if(Array.isArray(raw)){raw={entries:raw}}else{return out}
  }
  for(var i=0;i<raw.entries.length;i++){
    var en=raw.entries[i];
    if(!en||typeof en!=='object')continue;
    var date=typeof en.date==='string'?en.date:'';
    var text=typeof en.text==='string'?en.text:'';
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!text.trim())continue;
    out.push({date:date,text:text});
  }
  // newest first by date key
  out.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0});
  // de-dup by date, keep first (newest already sorted)
  var seen={},dedup=[];
  for(var j=0;j<out.length;j++){if(seen[out[j].date])continue;seen[out[j].date]=1;dedup.push(out[j])}
  return dedup;
}

function persist(){Vitality.save({entries:entries})}

function todayEntry(){var t=todayKey();for(var i=0;i<entries.length;i++){if(entries[i].date===t)return entries[i]}return null}

function updateCount(){
  var len=input.value.length;
  count.textContent=len+' / '+MAX;
  count.classList.toggle('warn',len>MAX-20);
  save.disabled=input.value.trim().length===0;
}

function syncCompose(){
  var te=todayEntry();
  if(te){
    saveLabel.textContent='Update today';
    sub.textContent='You wrote today. Edit it any time';
    if(!input.value)input.value=te.text;
  }else{
    saveLabel.textContent='Save line';
    sub.textContent='A single line about today';
  }
  updateCount();
}

function render(){
  scroll.innerHTML='';
  if(entries.length===0){
    var e=document.createElement('div');
    e.className='empty';
    e.innerHTML='<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#b9a3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><p>Your journal is empty. Write <span class="accent">one line</span> about today to begin.</p>';
    scroll.appendChild(e);
    return;
  }
  var t=todayKey();
  var ul=document.createElement('ul');
  ul.className='list';
  for(var i=0;i<entries.length;i++){
    var en=entries[i];
    var f=fmtDate(en.date);
    var li=document.createElement('li');
    li.className='entry';
    li.style.animationDelay=(Math.min(i,8)*0.035)+'s';
    var isToday=en.date===t;
    li.innerHTML='<div class="date'+(isToday?' today':'')+'">'+f.day+'<small>'+f.mon+'</small></div><div class="text">'+esc(en.text)+'</div>';
    ul.appendChild(li);
  }
  scroll.appendChild(ul);
}

function doSave(){
  var text=input.value.trim();
  if(!text)return;
  var t=todayKey();
  var te=todayEntry();
  if(te){te.text=text}
  else{entries.unshift({date:t,text:text})}
  // ensure newest-first ordering preserved
  entries.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0});
  persist();
  render();
  syncCompose();
  input.blur();
  save.classList.add('saved');
  if(savedTimer)clearTimeout(savedTimer);
  savedTimer=setTimeout(function(){save.classList.remove('saved')},1400);
}

input.addEventListener('input',updateCount);
input.addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();doSave()}});
save.addEventListener('click',doSave);

Vitality.load().then(function(d){
  entries=sanitize(d);
  render();
  syncCompose();
}).catch(function(){
  entries=[];
  render();
  syncCompose();
});
</script>
</body></html>
